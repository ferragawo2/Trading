<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>Connecting Deriv · Accumulator Lab</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b12;color:#edf3fb;font:15px/1.5 system-ui,sans-serif;padding:20px}.panel{width:min(100%,460px);background:#101621;border:1px solid #243144;border-radius:18px;padding:26px;text-align:center}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#20d6a0,#438bff);display:grid;place-items:center;color:#061019;font-weight:900;font-size:22px;margin:0 auto 16px}.muted{color:#91a0b4;font-size:13px}a{color:#20d6a0}
</style>
</head>
<body><main class="panel"><div class="mark">A</div><h1 id="heading">Completing secure Deriv connection…</h1><p class="muted" id="status">Checking the authorization response and exchanging the one-time code securely.</p></main>
<script>
(async()=>{
 const API="https://ferragawo-accumulator-oauth-api.onrender.com";
 const heading=document.getElementById("heading"),status=document.getElementById("status");
 const params=new URLSearchParams(location.search);
 const code=params.get("code"),state=params.get("state"),providerError=params.get("error");
 const show=(title,stage,detail,extra="")=>{
   heading.textContent=title;
   status.textContent="Stage: "+stage+"\\nProblem: "+detail+(extra?"\\nDetails: "+extra:"")+"\\n\\nDiagnostic ID: OAUTH-"+Date.now().toString(36).toUpperCase();
   status.style.whiteSpace="pre-wrap";
 };
 history.replaceState(null,"",location.pathname);
 if(providerError){
   show("Deriv authorization failed","Deriv consent",params.get("error_description")||providerError);
   return;
 }
 if(!code||!state){
   show("Authorization response incomplete","callback validation","The callback URL did not contain both the one-time authorization code and state.","code present: "+Boolean(code)+"; state present: "+Boolean(state));
   return;
 }
 try{
   status.textContent="Stage: backend exchange\\nSending the one-time code securely to the Accumulator backend…";
   const response=await fetch(API+"/oauth/exchange",{method:"POST",mode:"cors",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,state})});
   const raw=await response.text();
   let data={};
   try{data=raw?JSON.parse(raw):{};}catch(parseError){
     show("Backend returned an unreadable response","backend response","The OAuth backend did not return valid JSON.","HTTP "+response.status+"; content-type: "+(response.headers.get("content-type")||"missing")+"; response preview: "+raw.slice(0,240));
     return;
   }
   if(!response.ok||!data.connected||!data.session_id){
     show("Secure exchange failed",data.stage||"backend exchange",data.error||"Backend did not confirm a connected session.","HTTP "+response.status+"; code: "+(data.code||"not supplied")+(data.http_status?"; Deriv HTTP status: "+data.http_status:""));
     return;
   }
   sessionStorage.setItem("deriv_app_session",data.session_id);
   heading.textContent="Deriv connected";
   status.textContent="Stage: session handoff\\nThe backend created an app session. Returning to the Accumulator monitor…";
   setTimeout(()=>location.replace("/?connected=1"),900);
 }catch(e){
   const detail=e&&e.message?e.message:String(e);
   show("Could not reach the secure exchange","network / CORS",detail,"Check that the OAuth API is deployed and that APP_ORIGIN matches https://ferragawo-accumulator-lab.onrender.com exactly. No authorization code or token is shown here.");
 }
})();
</script></body></html>
